[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = src
addopts =
    --cov=trendpicker
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=70
    --strict-markers
    --strict-config
    -ra
markers =
    unit: unit tests for feature calculations
    integration: integration tests for pipelines
    regression: model regression baseline tests
    compliance: compliance/PII masking tests
    slow: slow tests (skipped by default in CI)
